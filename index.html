<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krem Chympe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    background: #05080f;
    color: #f3efe6;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  .text {
    position: fixed;
    left: 0; right: 0;
    text-align: center;
    padding: 0 24px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #title { top: calc(11vh + env(safe-area-inset-top, 0px)); }
  #title h1 {
    margin: 0;
    font-weight: 500;
    letter-spacing: .04em;
    font-size: clamp(46px, 13vw, 120px);
    line-height: 1;
  }
  #title p {
    font-family: system-ui, sans-serif;
    line-height: 1.5;
    margin: 14px auto 0;
    max-width: 32ch;
    font-size: clamp(13px, 3.6vw, 17px);
  }
  #cue {
    bottom: calc(5vh + env(safe-area-inset-bottom, 0px));
    font: 12px system-ui, sans-serif;
    letter-spacing: .2em;
    opacity: .7;
  }
</style>
</head>
<body>

<div class="text" id="title">
  <h1>Krem Chympe</h1>
  <p>A hidden waterfall in Khaddum village, East Jaintia Hills, Meghalaya, India</p>
</div>

<div class="text" id="cue">SCROLL TO EXPLORE</div>

</body>
</html>
